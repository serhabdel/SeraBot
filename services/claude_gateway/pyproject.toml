[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serabot-claude-gateway"
version = "0.1.0"
description = "Opt-in loopback-only claude-agent-sdk gateway for SeraBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
serabot-claude-gateway = "server:main"

[tool.setuptools]
py-modules = ["server"]
