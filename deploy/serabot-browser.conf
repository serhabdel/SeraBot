# Drop-in for an existing serabot.service: enables the 0.14 server browser.
# Install: /etc/systemd/system/serabot.service.d/browser.conf, then
#   systemctl daemon-reload && systemctl restart serabot
# Requires google-chrome-stable from Google's apt repo (Ubuntu's chromium
# packages are snap stubs, which do not run under this sandbox).
[Service]
RestrictNamespaces=user pid net mnt
MemoryMax=2200M
TasksMax=512
