[package]
name = "serabot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Type-check the Dioxus components on hosts without a WebView toolchain.
ui-check = ["dep:dioxus"]

[dependencies]
base64 = "0.22"
dioxus = { version = "0.7", optional = true, default-features = false, features = ["macro", "html", "hooks", "signals", "document"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
secrecy = "0.8"
# This PC card: the app's own memory/CPU and free disk space. System and disk
# readers only (no network, component or user lists).
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
rfd = { version = "0.17", default-features = false }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
tokio = { version = "1", features = ["time"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[lints.rust]
unsafe_code = "forbid"
