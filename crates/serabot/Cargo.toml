[package]
name = "serabot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "serabot"
path = "src/main.rs"

[features]
default = ["pptx", "docx"]
# PPTX support (`deck_pptx` writes generated decks, `pptx_ops` round-trips
# owner-supplied ones). `deckcraft-model` is the document model both consume; it
# re-exports the colour and geometry crates, so those stay transitive.
pptx = ["dep:deckcraft-pptx", "dep:deckcraft-model"]
# DOCX inspect/edit/build (`docx_ops`). `wordcraft-docx` is the reader/writer;
# `wordcraft-doc` is the document model it reads into and writes from, which
# the reader/writer crate only partially re-exports.
docx = ["dep:wordcraft-docx", "dep:wordcraft-doc"]

[dependencies]
age = { version = "0.11", features = ["armor"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
calamine = "0.24"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
clap = { version = "4", features = ["derive", "env"] }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "29f0f7772c47aa2bfb74fcbb0c4d3b1503300849", optional = true }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "29f0f7772c47aa2bfb74fcbb0c4d3b1503300849", optional = true }
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }
futures = "0.3"
# XLSX creation/editing. Pinned to the v0.9.0 revision; the crate's path dependencies
# (gridcraft-core, gridcraft-model, gridcraft-formula) resolve from the same repository.
# gridcraft-calc is deliberately absent: SeraBot never evaluates formulas.
gridcraft-core = { git = "https://github.com/storytold/gridcraft", rev = "a2cc4b42cac6e2c41bae71fba4607300755a0b47" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", rev = "a2cc4b42cac6e2c41bae71fba4607300755a0b47" }
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "a2cc4b42cac6e2c41bae71fba4607300755a0b47" }
hex = "0.4"
lopdf = "0.34"
printpdf = "0.7"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
rss = "2"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rust_decimal = { version = "1", features = ["serde"] }
scraper = "0.20"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1.9"
subtle = "2"
text-splitter = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# DOCX reader/writer, pinned to the v0.9.0 revision. Both crates resolve from the
# same repository; `wordcraft-doc` is the document model, `wordcraft-docx` the
# WordprocessingML reader/writer.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "2e6db0bd88795e80375176c01665cff7dbe2b057", optional = true }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "2e6db0bd88795e80375176c01665cff7dbe2b057", optional = true }
zeroize = "1"
# Package inspection for the bounded PPTX and DOCX round trips (part names,
# declared sizes, VBA parts, `.rels` parts) before either reader inflates
# anything, plus the post-export link check. Same version and features
# deckcraft-pptx already resolves, so this adds no new crate.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
