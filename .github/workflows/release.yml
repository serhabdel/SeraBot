name: release

# Client downloads. Push a tag to publish:
#   git tag v0.3.2 && git push origin v0.3.2
# Or dispatch this workflow with an existing tag, for example v0.3.2.
# The workflow builds the Windows desktop client and the Android app, then
# posts both to the GitHub Release for that tag. No secrets are required for
# the artifacts themselves; the optional SERABOT_OWNER_API_URL prefill and the
# Android signing secrets are read when configured (see docs/ci-and-secrets.md).
# The owner token is never read, compiled, or embedded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v0.3.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Optional repository secret (synthetic example: https://owner.example).
      # Unset expands to empty; the binary then compiles with an empty prefill
      # and the server field stays generic.
      SERABOT_OWNER_API_URL: ${{ secrets.SERABOT_OWNER_API_URL }}
      SERABOT_RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Record checked-out commit
        shell: bash
        run: echo "SERABOT_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "dispatch tag must look like v0.3.2" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked -p serabot-desktop
      - name: Package the client
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\serabot-desktop.exe -DestinationPath "serabot-desktop-$env:TAG-windows-x64.zip"
          Copy-Item target\release\serabot-desktop.exe "serabot-desktop-$env:TAG-windows-x64.exe"
          Copy-Item target\release\serabot-desktop.exe "serabot-desktop-latest-windows-x64.exe"
          Copy-Item "serabot-desktop-$env:TAG-windows-x64.zip" "serabot-desktop-latest-windows-x64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-assets
          path: |
            serabot-desktop-${{ github.event.inputs.tag || github.ref_name }}-windows-x64.exe
            serabot-desktop-${{ github.event.inputs.tag || github.ref_name }}-windows-x64.zip
            serabot-desktop-latest-windows-x64.exe
            serabot-desktop-latest-windows-x64.zip

  mobile:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Optional repository secret, origin only. Never the token.
      SERABOT_OWNER_API_URL: ${{ secrets.SERABOT_OWNER_API_URL }}
      # Required Android release keystore (the job fails without it). Values are
      # never echoed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "dispatch tag must look like v0.3.2" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: apps/serabot_mobile
        run: flutter pub get
      - name: Configure release signing
        working-directory: apps/serabot_mobile
        run: |
          # Release builds must carry the stable key: Android refuses to install
          # an update signed with a different key, and the in-app updater relies
          # on that. Never fall back to the debug key here.
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing. Run scripts/make-android-keystore.ps1 and set the secrets it prints." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SERABOT_REQUIRE_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: apps/serabot_mobile
        run: |
          flutter build apk --release \
            --build-name="${TAG#v}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SERABOT_DEFAULT_SERVER_URL="${SERABOT_OWNER_API_URL}"
          cp build/app/outputs/flutter-apk/app-release.apk "serabot-mobile-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "serabot-mobile-latest.apk"
          # Checksum the in-app updater verifies before installing.
          sha256sum "serabot-mobile-${TAG}.apk" > "serabot-mobile-${TAG}.apk.sha256"
      - name: Build release app bundle
        working-directory: apps/serabot_mobile
        run: |
          flutter build appbundle --release \
            --build-name="${TAG#v}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SERABOT_DEFAULT_SERVER_URL="${SERABOT_OWNER_API_URL}"
          cp build/app/outputs/bundle/release/app-release.aab "serabot-mobile-${TAG}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "serabot-mobile-latest.aab"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-assets
          path: |
            apps/serabot_mobile/serabot-mobile-${{ github.event.inputs.tag || github.ref_name }}.apk
            apps/serabot_mobile/serabot-mobile-${{ github.event.inputs.tag || github.ref_name }}.apk.sha256
            apps/serabot_mobile/serabot-mobile-${{ github.event.inputs.tag || github.ref_name }}.aab
            apps/serabot_mobile/serabot-mobile-latest.apk
            apps/serabot_mobile/serabot-mobile-latest.aab

  publish:
    needs: [desktop, mobile]
    # The desktop and server release must not wait on Android signing: when
    # the mobile job fails (for example, signing secrets not set yet), publish
    # still ships the desktop assets. The mobile job stays red as the signal.
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
