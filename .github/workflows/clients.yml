name: clients

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Optional repository secrets. Unset secrets expand to empty and CI still passes.
#   SERABOT_OWNER_API_URL — HTTPS origin (synthetic example: https://owner.example).
#     Desktop compiles and reads this name. Mobile receives it as
#     --dart-define=SERABOT_DEFAULT_SERVER_URL.

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SERABOT_TEST_MODE: "1"
      SERABOT_OWNER_API_URL: ${{ secrets.SERABOT_OWNER_API_URL }}
      SERABOT_RELEASES_REPO: ${{ github.repository }}
      SERABOT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check -p serabot-desktop --locked
      - name: Test
        run: cargo test -p serabot-desktop --locked
      - name: Release build
        run: cargo build --release -p serabot-desktop --locked
      - name: Package Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\serabot-desktop.exe -DestinationPath "serabot-desktop-$env:GITHUB_SHA-windows-x64.zip"
      - name: Upload Windows client
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: serabot-desktop-${{ github.sha }}-windows-x64
          path: serabot-desktop-${{ github.sha }}-windows-x64.zip
          retention-days: 14

  mobile:
    runs-on: ubuntu-latest
    env:
      SERABOT_OWNER_API_URL: ${{ secrets.SERABOT_OWNER_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: apps/serabot_mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/serabot_mobile
        run: flutter analyze
      - name: Test with optional server URL
        working-directory: apps/serabot_mobile
        run: |
          flutter test \
            --dart-define=SERABOT_DEFAULT_SERVER_URL="${SERABOT_OWNER_API_URL}"
      - name: Build debug APK
        working-directory: apps/serabot_mobile
        run: |
          flutter build apk --debug \
            --dart-define=SERABOT_DEFAULT_SERVER_URL="${SERABOT_OWNER_API_URL}"
      # Release-mode compile (R8/shrinking, release manifest) so a release-only
      # failure shows up on PRs instead of at tag time. Debug-signed; not published.
      - name: Build release APK (compile check)
        working-directory: apps/serabot_mobile
        run: |
          flutter build apk --release \
            --dart-define=SERABOT_DEFAULT_SERVER_URL="${SERABOT_OWNER_API_URL}"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: serabot-mobile-debug-${{ github.sha }}
          path: apps/serabot_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
