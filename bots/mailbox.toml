  "mail_list",
  "mail_read",
  "mail_send",
  "ask_user",
  "skill_list",
  "skill_search",
  "skill_load",
  "memory_save",
  "memory_list",
  "memory_delete",
  "conversation_library",
  "ask_teammate",
]
require_approval = ["mail_send"]
enabled = true
