# SeraBot example configuration. Copy/adapt locally; never commit real secrets.
# All relative paths resolve against this file's directory.

[server]
bind = "127.0.0.1:8787"
body_limit_bytes = 2097152
request_timeout_secs = 30
rate_limit_per_minute = 60
event_retention_days = 30
allow_non_loopback = false

[database]
path = "data/serabot.db"
max_connections = 4
busy_timeout_ms = 5000

[secrets]
encrypted_file = "private/secrets.age"
identity_file = "private/age-identity.txt"

[api]
enabled = false
# Generate with: printf '%s' "$TOKEN" | serabot hash-token
token_hash = ""
approval_expiry_hours = 24

[telegram]
enabled = false
bot_token_secret = "telegram_bot_token"
owner_user_id = 0
owner_chat_id = 0
poll_timeout_secs = 25

[llm]
base_url = "https://api.mistral.ai/v1"
model = "mistral-large-latest"
api_key_secret = "llm_api_key"
timeout_secs = 120
# Tool rounds: runtime.max_tool_iterations and llm.max_tool_rounds; loop uses the higher value.
max_tool_rounds = 10
# Provider may advertise 1M+ context; SeraBot forwards max_tokens only (no local input cap).
max_output_tokens = 32768
# Set true only after you accept that selected prompt/document passages leave this host.
data_egress_approved = false
# Builtin kind. Empty means a generic OpenAI-compatible base.
kind = "mistral"
# Fetch GET {base}/models, cache it, and intersect with the allowlist. Fail closed.
catalog_fetch = true
catalog_ttl_secs = 1800
# [llm] is the reserved "default" provider. Its model and bot overrides are allowed too.
# /models and /providers show the allowlist, narrowed by the cached catalog when fetch is on.
# Optional logical classes for orchestration handoffs (models must appear above or in [llm].model).
# [llm.classes]
# routine = ["mistral-small-latest", "ministral-8b-latest"]
# synthesis = ["mistral-large-latest", "mistral-medium-latest"]
models = [
  "mistral-large-latest",
  "mistral-medium-latest",
  "mistral-small-latest",
  "codestral-latest",
  "ministral-8b-latest",
  "open-mistral-nemo",
  "magistral-medium-latest",
  "magistral-small-latest",
  "devstral-small-latest",
  "pixtral-large-latest",
]
# Optional profiles. Store each api_key_secret with `serabot secrets set` before enabling.
# Selection never grants consent. catalog_fetch narrows `models` and hides them if refresh fails.
# kind fills base_url when it is omitted. Cloud Code Assist hosts are rejected.
#
# [llm.providers.deepseek]
# kind = "deepseek"
# api_key_secret = "deepseek_api_key"
# models = ["deepseek-flash", "deepseek-v4-pro"]
# catalog_fetch = true
# data_egress_approved = false
# Chat base is https://api.deepseek.com/v1. The catalog is GET https://api.deepseek.com/models.
#
# [llm.providers.minimax]
# kind = "minimax"
# api_key_secret = "minimax_m_plan_key"
# models = ["MiniMax-M3.1-Flash", "MiniMax-M3"]
# catalog_fetch = true
# data_egress_approved = false
# M Plan subscription keys and pay-as-you-go keys are different secrets. Same catalog:
# GET https://api.minimax.io/v1/models. Store the secret name only.
#
# [llm.providers.openai]
# kind = "openai"
# api_key_secret = "openai_api_key"
# models = ["gpt-4.1"]
# catalog_fetch = true
# data_egress_approved = false
#
# Other OpenAI-compatible kinds: groq, together, fireworks, openrouter, xai, cerebras, moonshot, minimax-cn.
#
# [llm.providers.muse]
# kind = "muse-code"
# auth = "oauth"
# api_key_secret = "muse_code_api_key"
# refresh_token_secret = "muse_code_identity"
# models = ["muse-spark-1.3"]
# catalog_fetch = true
# data_egress_approved = false
# Sign in with: serabot providers login muse-code
#
# [llm.providers.antigravity]
# kind = "google-antigravity"
# auth = "oauth"
# # Empty base_url uses https://daily-cloudcode-pa.googleapis.com. Other documented
# # Cloud Code origins are allowed; OpenAI-compatible hosts are not.
# api_key_secret = "antigravity_access_token"
# refresh_token_secret = "antigravity_refresh_token"
# oauth_client_secret_secret = "antigravity_oauth_client_secret"
# # Leave oauth_client_id_secret empty to use the built-in Antigravity client id.
# project_id = ""
# models = ["example-model"]
# catalog_fetch = true
# data_egress_approved = false
# One-time sign-in: store the published desktop client secret, then
# `serabot providers login google-antigravity`. See docs/antigravity.md.

[embeddings]
model = "multilingual-e5-small"
dimension = 384
cache_dir = "models"
batch_size = 16

[policy]
blocklist_file = "private/blocklist.txt"
notify_owner_on_violation = true

[watcher]
sources_file = "config/sources.toml"
user_agent = "SeraBot/0.1 (personal research agent)"
timeout_secs = 30
max_response_bytes = 5242880
morning_brief_enabled = true

[elevenlabs]
enabled = false
api_base = "https://api.elevenlabs.io"
api_key_secret = "elevenlabs_api_key"
timeout_secs = 120
# Optional default voice when tools omit voice_id (set after listing voices).
default_voice_id = ""
tts_model = "eleven_multilingual_v2"
stt_model = "scribe_v2"
image_model = "gemini-2.5-flash-image"
video_model = "bytedance-seedance-v2-mini"
max_tts_chars = 5000
poll_interval_ms = 2000
poll_max_attempts = 60

[onedrive]
enabled = false
graph_base = "https://graph.microsoft.com/v1.0"
tenant = "consumers"
client_id_secret = "onedrive_client_id"
refresh_token_secret = "onedrive_refresh_token"
folder = "SeraBot"
conflict_behavior = "rename"

# Firecrawl v2 (scrape / map / search / crawl). Disabled by default.
# Store the API key in the age secret store: serabot secrets set firecrawl_api_key
[firecrawl]
enabled = false
api_base = "https://api.firecrawl.dev"
api_key_secret = "firecrawl_api_key"
timeout_secs = 120
max_markdown_chars = 80000
max_map_links = 500
max_map_limit = 500
max_search_limit = 10
max_crawl_limit = 25
crawl_poll_interval_ms = 2000
crawl_max_wait_secs = 300

[render]
brand_file = "config/brand.example.toml"
artifacts_dir = "data/artifacts"
max_pages = 30

[runtime]
max_concurrent_turns = 2
max_tool_calls_per_turn = 12
max_tool_iterations = 10
task_lease_secs = 300
worker_poll_ms = 500
history_limit = 50
owner_standing_consent = false

[schedule]
tick_secs = 30
timezone = "Europe/Rome"
brief_time = "08:00"
source_stagger_secs = 20
watch_times = ["07:45", "13:00", "18:00"]

[skills]
dir = "skills"

[documents]
watch_dir = "data/inbox"
max_bytes = 52428800
chunk_chars = 1200
chunk_overlap = 150
retrieval_k = 8

# Mistral Voxtral transcription + audio-in-chat understanding (outbound; requires llm.data_egress_approved).
[audio]
enabled = false
provider = "default"
# Set enabled + telegram_intake true for owner voice notes in inbox (tools still need approval).
# base_url = "https://api.mistral.ai/v1"
# api_key_secret = "llm_api_key"
transcription_model = "voxtral-mini-latest"
understanding_model = "voxtral-small-latest"
max_bytes = 52428800
telegram_intake = false
telegram_max_bytes = 20971520

[browser]
enabled = false
provider = "spawn_cdp"
chromium_executable = ""
remote_debugging_host = "127.0.0.1"
remote_debugging_port = 9222
browseros_neo_base = "http://127.0.0.1:7333"
user_data_dir = ""
request_timeout_secs = 30

# OAuth connectors stay off until the age store has the named keys.
# redirect_uri, when set, must be loopback http://127.0.0.1:<port>/<path>.
[connectors.google_drive]
enabled = false
client_id_secret = "google_oauth_client_id"
client_secret_secret = "google_oauth_client_secret"
refresh_token_secret = "google_drive_refresh_token"
redirect_uri = ""

[connectors.google_sheets]
enabled = false
client_id_secret = "google_oauth_client_id"
client_secret_secret = "google_oauth_client_secret"
refresh_token_secret = "google_sheets_refresh_token"
redirect_uri = ""

[connectors.google_calendar]
enabled = false
client_id_secret = "google_oauth_client_id"
client_secret_secret = "google_oauth_client_secret"
refresh_token_secret = "google_calendar_refresh_token"
redirect_uri = ""

[connectors.gmail]
enabled = false
client_id_secret = "google_oauth_client_id"
client_secret_secret = "google_oauth_client_secret"
refresh_token_secret = "gmail_refresh_token"
redirect_uri = ""

[connectors.outlook]
enabled = false
client_id_secret = "outlook_client_id"
client_secret_secret = "outlook_client_secret"
refresh_token_secret = "outlook_refresh_token"
redirect_uri = ""

[connectors.outlook_calendar]
enabled = false
client_id_secret = "outlook_client_id"
client_secret_secret = "outlook_client_secret"
refresh_token_secret = "outlook_calendar_refresh_token"
redirect_uri = ""

[connectors.notion]
enabled = false
client_id_secret = "notion_oauth_client_id"
client_secret_secret = "notion_oauth_client_secret"
refresh_token_secret = "notion_refresh_token"
redirect_uri = ""

[connectors.agentmail]
enabled = false
api_base = "https://api.agentmail.to/v0"
api_key_secret = "agentmail_api_key"
timeout_secs = 60
default_inbox_id = ""
